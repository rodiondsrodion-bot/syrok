name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SyrokLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager “platforms;android-34” “build-tools;34.0.0” “ndk;26.1.10909125” “cmake;3.22.1”
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - working-directory: SyrokLauncher
        run: gradle assembleDebug —no-daemon
      - run: cp SyrokLauncher/app/build/outputs/apk/debug/app-debug.apk SyrokLauncher.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Syrok Launcher
          files: SyrokLauncher.apk
