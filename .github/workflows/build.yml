name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q SyrokLauncher.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
              - name: Build debug APK
        working-directory: SyrokLauncher
        run: gradle assembleDebug
      - run: cp SyrokLauncher/app/build/outputs/apk/debug/app-debug.apk SyrokLauncher.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Syrok Launcher
          files: SyrokLauncher.apk
