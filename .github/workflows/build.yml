name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q SyrokLauncher.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n1)")
          echo "Project dir: $DIR"
          cd "$DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
          cp "$(find . -name '*-debug.apk' | head -n1)" "$GITHUB_WORKSPACE/SyrokLauncher.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Syrok Launcher
          files: SyrokLauncher.apk
